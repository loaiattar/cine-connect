name: CinéConnect CI Pipeline

on:
  push:
    branches-ignore:
      - main 
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Lint and Typecheck
        run: pnpm turbo run lint

      - name: Build Projects
        run: pnpm turbo run build