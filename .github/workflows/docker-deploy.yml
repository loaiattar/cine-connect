name: Docker Build and Push

on:
  push:
    branches:
      - main 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate required production vars
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "Missing required repository variable: VITE_API_BASE_URL"
            echo "Set it in Settings -> Secrets and variables -> Actions -> Repository variables."
            exit 1
          fi
          if [ -z "${{ vars.VITE_APP_NAME }}" ]; then
            echo "Missing required repository variable: VITE_APP_NAME"
            echo "Set it in Settings -> Secrets and variables -> Actions -> Repository variables."
            exit 1
          fi
          if [ -z "${{ vars.VITE_TMDB_IMAGE_BASE_URL }}" ]; then
            echo "Missing required repository variable: VITE_TMDB_IMAGE_BASE_URL"
            echo "Set it in Settings -> Secrets and variables -> Actions -> Repository variables."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_TMDB_IMAGE_BASE_URL=${{ vars.VITE_TMDB_IMAGE_BASE_URL }}
            NGINX_API_UPSTREAM=${{ vars.VITE_API_BASE_URL }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile 
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest