# Images are reused until you rebuild. After `git pull` or backend/frontend code changes, use:
#   pnpm docker:up
# or: docker compose up -d --build
# Quick reuse (no rebuild): pnpm docker:up:quick
services:
  db:
    image: postgres:15-alpine
    container_name: cine-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cineconnect
    ports:
      - "5432:5432"
    networks:
      - cineconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cineconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  cine-db-test:
    image: postgres:15-alpine
    container_name: cine-db-test
    environment:
      POSTGRES_DB: cineconnect_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    networks:
      - cineconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cineconnect_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: cine-backend
    ports:
      - "3000:3000"
    # No env_file: all vars from environment below. Set secrets in a root .env
    # (Compose loads it for ${VAR} substitution) or: export TMDB_API_KEY=... JWT_SECRET=... && docker compose up
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://admin:password123@db:5432/cineconnect
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cineconnect-network

  # VITE_* vars are baked in at image build time. Set VITE_API_BASE_URL in root .env (see .env.example)
  # or: docker compose build --build-arg VITE_API_BASE_URL=https://api.example.com frontend
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_APP_NAME: ${VITE_APP_NAME:-CinéConnect}
        VITE_TMDB_IMAGE_BASE_URL: ${VITE_TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
    container_name: cine-frontend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cineconnect-network

networks:
  cineconnect-network:
    driver: bridge