services:
  db:
    image: postgres:15
    container_name: cine-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cineconnect
    ports:
      - "5432:5432"
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - ./apps/frontend/.env
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgres://admin:password123@db:5432/cineconnect
    depends_on:
      - db
