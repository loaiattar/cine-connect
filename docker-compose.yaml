# Images are reused until you rebuild. After `git pull` or backend/frontend code changes, use:
#   pnpm docker:up
# or: docker compose up -d --build
# Quick reuse (no rebuild): pnpm docker:up:quick
#
# Database passwords are never hardcoded. Set POSTGRES_PASSWORD and POSTGRES_TEST_PASSWORD in a
# root .env (see .env.example). In production, inject them from your orchestrator or a secrets
# manager (Docker Swarm secrets, AWS Secrets Manager, etc.) rather than committing .env.
services:
  db:
    image: postgres:15-alpine
    container_name: cine-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-cineconnect}
    ports:
      - "5432:5432"
    networks:
      - cineconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cine-db-test:
    image: postgres:15-alpine
    container_name: cine-db-test
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-cineconnect_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?POSTGRES_TEST_PASSWORD must be set — copy .env.example to .env}
    ports:
      - "5433:5432"
    networks:
      - cineconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: cine-backend
    volumes:
      - ./apps/backend/uploads:/app/apps/backend/uploads
    ports:
      - "3000:3000"
    # No env_file: all vars from environment below. Set secrets in a root .env
    # (Compose loads it for ${VAR} substitution) or: export TMDB_API_KEY=... JWT_SECRET=... && docker compose up
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cineconnect}
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_URL: ${MAILGUN_URL:-}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cineconnect-network

  # VITE_* vars are baked in at image build time. Set VITE_API_BASE_URL in root .env (see .env.example)
  # or use VITE_SAME_ORIGIN_API=true with empty VITE_API_BASE_URL (nginx proxies /api to backend).
  # NGINX_API_UPSTREAM must be reachable from the frontend container (Compose service name + port).
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_SAME_ORIGIN_API: ${VITE_SAME_ORIGIN_API:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_APP_NAME: ${VITE_APP_NAME:-CinéConnect}
        VITE_TMDB_IMAGE_BASE_URL: ${VITE_TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
        NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-http://backend:3000}
    container_name: cine-frontend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cineconnect-network

networks:
  cineconnect-network:
    driver: bridge