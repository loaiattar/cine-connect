map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name cinelumera.app www.cinelumera.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cinelumera.app www.cinelumera.app;
    root /usr/share/nginx/html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/cinelumera.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinelumera.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    client_max_body_size 25m;

    # API Proxy
    location /api/ {
        proxy_pass __NGINX_API_UPSTREAM__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host __NGINX_API_HOST__;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /uploads/ {
        proxy_pass __NGINX_API_UPSTREAM__/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host __NGINX_API_HOST__;
        expires -1;
    }

    location /socket.io/ {
        proxy_pass __NGINX_API_UPSTREAM__/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host __NGINX_API_HOST__;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}