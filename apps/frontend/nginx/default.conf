# CinéConnect static SPA (Vite dist). Security headers, gzip, and caching for Vite output.
# This image listens on :80. UAs ignore HSTS over cleartext; when TLS terminates at a
# proxy in front, prefer setting HSTS there too (single source of truth for the browser).
#
# Placeholders __NGINX_API_UPSTREAM__ (full origin, no trailing slash) and __NGINX_API_HOST__
# (host[:port] only) are replaced at image build time (see apps/frontend/Dockerfile).

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    # --- Security headers (static shell; API CSP is separate on the backend) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # connect-src is broad so the browser can reach VITE_API_BASE_URL (any host/scheme at build time).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:" always;

    client_max_body_size 25m;

    # Same-origin API (browser → this host): httpOnly auth cookies work without cross-site rules.
    location /api/ {
        proxy_pass __NGINX_API_UPSTREAM__/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __NGINX_API_HOST__;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass __NGINX_API_UPSTREAM__/uploads/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __NGINX_API_HOST__;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass __NGINX_API_UPSTREAM__/socket.io/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __NGINX_API_HOST__;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
    }

    # Hashed build output: long cache (immutable filenames from Vite).
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Short cache for unhashed root static files (favicon, etc.).
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
