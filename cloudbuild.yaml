# Cloud Build: build/push images and deploy to Cloud Run (europe-west1).
#
# Before this works:
# 1) Secret Manager: create secrets JWT_SECRET, TMDB_API_KEY, DATABASE_URL (same names as below).
#    JWT_SECRET: at least 32 characters when NODE_ENV=production (backend validateEnv).
#    DATABASE_URL example for Cloud SQL socket:
#    postgresql://USER:PASSWORD@/DBNAME?host=/cloudsql/PROJECT_ID:REGION:INSTANCE
# 2) Cloud Build service account needs: roles/run.admin, roles/iam.serviceAccountUser on the
#    Cloud Run runtime SA, roles/secretmanager.secretAccessor on those secrets,
#    roles/logging.logWriter, Artifact Registry writer. Runtime SA: roles/cloudsql.client.
# 3) Override _FRONTEND_ORIGIN / _BACKEND_URL / _CLOUDSQL_INSTANCE in the trigger if needed.
# 4) After first deploy or schema changes: run DB migrations on Cloud SQL (apps/backend/README.md).
#
# Never put DATABASE_URL, JWT_SECRET, or TMDB_API_KEY in --set-env-vars / --update-env-vars.
# If a key was once a secret and you switch to a literal (or the reverse), gcloud fails until
# the old binding is removed. Pass 1 (services update) strips both kinds; pass 2 deploys fresh.

substitutions:
  _FRONTEND_ORIGIN: https://frontend-service-96031994791.europe-west1.run.app
  _BACKEND_URL: https://backend-service-96031994791.europe-west1.run.app
  _CLOUDSQL_INSTANCE: lumera-491513:europe-west1:lumera-db-instance

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/backend:latest', '-f', 'apps/backend/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/backend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Strip plaintext + secret bindings so deploy can re-attach DATABASE_URL as secret only.
        gcloud run services update backend-service \
          --region=europe-west1 \
          --remove-env-vars=JWT_SECRET,TMDB_API_KEY,DATABASE_URL \
          --remove-secrets=JWT_SECRET,TMDB_API_KEY,DATABASE_URL \
          --no-traffic \
          --quiet || true
        gcloud run deploy backend-service \
          --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/backend:latest \
          --region=europe-west1 \
          --add-cloudsql-instances=${_CLOUDSQL_INSTANCE} \
          --set-env-vars=NODE_ENV=production,FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},AUTH_COOKIE_SAME_SITE=none \
          --set-secrets=JWT_SECRET=JWT_SECRET:latest,TMDB_API_KEY=TMDB_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest \
          --allow-unauthenticated

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/frontend:latest'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_BACKEND_URL}'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/frontend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend-service'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/frontend:latest'
      - '--region=europe-west1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY
