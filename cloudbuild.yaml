# Cloud Build: build/push images and deploy to Cloud Run (europe-west1).
#
# Before this works:
# 1) Secret Manager: create secrets JWT_SECRET, TMDB_API_KEY, DATABASE_URL (same names as below).
#    JWT_SECRET: at least 32 characters when NODE_ENV=production (backend validateEnv).
#    DATABASE_URL example for Cloud SQL socket:
#    postgresql://USER:PASSWORD@/DBNAME?host=/cloudsql/PROJECT_ID:REGION:INSTANCE
# 2) Cloud Build service account (see trigger "Service account", often ...@cloudbuild.gserviceaccount.com)
#    needs: roles/run.admin, roles/iam.serviceAccountUser on the Cloud Run runtime SA,
#    roles/secretmanager.secretAccessor on those secrets, roles/logging.logWriter (fixes truncated logs),
#    and Artifact Registry writer. Cloud Run's runtime SA needs roles/cloudsql.client for --add-cloudsql-instances.
# 3) Override _FRONTEND_ORIGIN / _BACKEND_URL in the trigger if URLs differ.
#
# If deploy fails with: "Cannot update environment variable [TMDB_API_KEY] to string literal
# because it has already been set with a different type" — an older revision used plaintext
# env while the new deploy uses secrets (or the reverse). The Deploy Backend step removes
# both bindings before re-applying secrets so the types stay consistent.

substitutions:
  _FRONTEND_ORIGIN: https://frontend-service-96031994791.europe-west1.run.app
  _BACKEND_URL: https://backend-service-96031994791.europe-west1.run.app
  _CLOUDSQL_INSTANCE: lumera-491513:europe-west1:lumera-db-instance

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/backend:latest', '-f', 'apps/backend/Dockerfile', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/backend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend-service'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/backend:latest'
      - '--region=europe-west1'
      - '--add-cloudsql-instances=lumera-491513:europe-west1:lumera-db-instance'
      - '--update-env-vars'
      - 'NODE_ENV=production,FRONTEND_ORIGIN=https://frontend-service-96031994791.europe-west1.run.app,DATABASE_URL=postgresql://postgres:PASSWORD_loai123@/cineconnect_db?host=/cloudsql/lumera-491513:europe-west1:lumera-db-instance'
      - '--update-secrets'
      - 'JWT_SECRET=JWT_SECRET:latest,TMDB_API_KEY=TMDB_API_KEY:latest'
      - '--allow-unauthenticated'
      
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/frontend:latest'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_BACKEND_URL}'
      - '-f'
      - 'apps/frontend/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/frontend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend-service'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cine-connect-repo/frontend:latest'
      - '--region=europe-west1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY
